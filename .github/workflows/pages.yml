name: Pages
# The latest release (publish.sh) on GitHub Pages: the iPhone web app (web/), plus the APK and versionCode read by
# installed Android apps (Update.kt).
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: iPhone web app
        run: web/build.sh _site
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --json tagName -q .tagName)
          gh release download "$tag" -p dexsearch.apk -D _site
          echo "${tag#v}" > _site/version
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
