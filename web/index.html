<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DexSearch</title>
<meta name="description" content="Offline Pokédex and team builder">
<!-- Link previews (Discord, Telegram, X, iMessage). Absolute URLs on the custom domain, which d3andark.github.io redirects to. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="DexSearch">
<meta property="og:title" content="DexSearch: offline Pokédex and team builder">
<meta property="og:description" content="Every Pokémon, form, move, ability and held item from Gen 1 to 9, per-game Pokédexes, type chart, Smogon sets and teams for Showdown. Android app, and a web app for iPhone and computers that works offline.">
<meta property="og:url" content="https://deandark.me/dexsearch/">
<meta property="og:image" content="https://deandark.me/dexsearch/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="DexSearch: all 1025 Pokémon as white silhouettes on red, the magnifier from its icon showing Garchomp in color">
<meta name="twitter:card" content="summary_large_image">
<!-- The accent for a link preview's color bar (Discord reads theme-color), first for crawlers that ignore media.
     "not all" matches no browser, so their toolbars still use the two below. -->
<meta name="theme-color" content="#D8300C" media="not all">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DexSearch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script>
try {
  const t = JSON.parse(localStorage.getItem('dex.theme'));
  if (t === 1) document.documentElement.dataset.theme = 'light';
  if (t === 2) document.documentElement.dataset.theme = 'dark';
} catch (e) {}
</script>
</head>
<body>
<div class="boot" id="boot">DexSearch</div>
<script src="dex.js"></script>
<script src="app.js"></script>
</body>
</html>
